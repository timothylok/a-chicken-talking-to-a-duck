<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>食蛇 — 雞同鴨講</title>
<style>
  /* Falls back to a monospace stack (still keeps the CJK fonts so Chinese
     text renders correctly -- Nokia Cellphone FC/Courier New have no CJK
     glyphs, so the browser's per-character fallback covers those). A
     bitmap-emulating font (per gateway/public/fonts/nokiafc22.txt) --
     renders crispest at 8px multiples with antialiasing off. */
  @font-face {
    font-family: "Nokia Cellphone FC";
    src: url("/fonts/nokiafc22.ttf") format("truetype");
    font-display: swap;
  }
  :root { --bg: #ffffff; --fg: #1a1a1a; --muted: #666; --line: #e0e0e0; --accent: #b45309; --bubble: #f4f4f5; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #16181d; --fg: #e8e8e8; --muted: #9a9a9a; --line: #333; --accent: #f59e0b; --bubble: #24272e; }
  }
  body { margin: 0 auto; max-width: 26rem; padding: 1.5rem 1.25rem 2rem;
         background: var(--bg); color: var(--fg);
         font-family: "Nokia Cellphone FC", "Courier New", "PingFang HK", "Microsoft JhengHei", monospace;
         line-height: 1.6; box-sizing: border-box; text-align: center; }
  h1 { font-size: 1.3rem; margin: 1.5rem 0 0.25rem; }
  .tagline { color: var(--muted); margin: 0 0 0.5rem; font-size: 0.9rem; }

  /* Phone chrome: fixed colours, not theme-aware -- it's meant to look like
     a physical object, not restyle with the site's light/dark mode. */
  .phone { background: linear-gradient(160deg, #3a3f66, #21243c);
           border-radius: 2.2rem; padding: 1.4rem 1.1rem 1.6rem;
           margin: 0 auto; max-width: 20rem;
           box-shadow: 0 12px 28px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.08); }
  .phone-brand { text-align: center; color: #e8eaf5; font-weight: 800;
                 letter-spacing: 0.3em; font-size: 0.8rem; margin: 0 0 0.9rem; }
  .screen-bezel { background: #aab0bd; border-radius: 1rem; padding: 0.55rem;
                  box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.4); }
  .lcd { position: relative; background: #9bbc0f; border-radius: 0.35rem;
         padding: 0.4rem 0.5rem 0.5rem; overflow: hidden; }
  .lcd-statusbar { display: flex; justify-content: space-between; align-items: center;
                   color: #1f3300; font-family: "Courier New", monospace; font-weight: 700;
                   font-size: 0.85rem; padding: 0 0.15rem 0.3rem; }
  #board { display: block; width: 100%; height: auto; }
  #overlay { position: absolute; inset: 0.4rem; display: none; flex-direction: column;
             align-items: center; justify-content: center; gap: 0.6rem;
             background: rgba(15, 40, 10, 0.88); border-radius: 0.2rem; }
  #overlay.show { display: flex; }
  #overlay p { margin: 0; font-size: 0.95rem; color: #cdeaa0; font-family: "Courier New", monospace; }
  #restart-btn { border: none; border-radius: 999px; background: #9bbc0f; color: #1f3300;
                 font: inherit; font-weight: 700; font-size: 0.85rem; padding: 0.5rem 1.1rem; cursor: pointer; }

  .softkeys { display: flex; justify-content: space-between; align-items: center;
              padding: 0.7rem 0.5rem 0.15rem; color: #b9c0d6; font-size: 1rem; }
  .nub { width: 2.4rem; height: 1rem; border-radius: 999px; background: #4c5178; }

  .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem; margin-top: 0.5rem; }
  .key { background: linear-gradient(180deg, #f4f5fa, #cfd3e2); border: none;
         border-radius: 999px; padding: 0.55rem 0 0.4rem; color: #23263f;
         font-weight: 700; font-size: 1.05rem; box-shadow: 0 2px 0 rgba(0, 0, 0, 0.25);
         cursor: pointer; }
  .key:active { transform: translateY(1px); box-shadow: none; }
  .key.key-dir { background: linear-gradient(180deg, #f4f5fa, #b9d98a); }
  .key small { display: block; font-weight: 600; font-size: 0.6rem; color: #3f6015; margin-top: 0.1rem; }

  #music-btn { border: 1px solid var(--line); border-radius: 999px; background: none;
               color: var(--fg); font: inherit; font-size: 0.9rem; padding: 0.4rem 1rem;
               cursor: pointer; margin-top: 1.5rem; }
  #music-btn.playing { border-color: var(--accent); color: var(--accent); }

  footer { margin-top: 1.5rem; color: var(--muted); font-size: 0.78rem; }
  footer a { color: inherit; }
</style>
</head>
<body>

<div class="phone">
  <div class="phone-brand">SNAKE</div>
  <div class="screen-bezel">
    <div class="lcd">
      <div class="lcd-statusbar">
        <span id="score">0000</span>
        <span>🏆 <span id="high-score">0000</span></span>
      </div>
      <div id="board-wrap">
        <canvas id="board" width="480" height="320"></canvas>
        <div id="overlay">
          <p id="overlay-text"></p>
          <button id="restart-btn">再嚟一鋪 / play again</button>
        </div>
      </div>
    </div>
  </div>
  <div class="softkeys">
    <span>⌐</span>
    <span class="nub"></span>
    <span>¬</span>
  </div>
  <div class="keypad">
    <button class="key">1</button>
    <button class="key key-dir" data-dir="up">2<small>▲</small></button>
    <button class="key">3</button>
    <button class="key key-dir" data-dir="left">4<small>◀</small></button>
    <button class="key key-dir" id="pause-btn">5<small id="pause-icon">⏸</small></button>
    <button class="key key-dir" data-dir="right">6<small>▶</small></button>
    <button class="key">7</button>
    <button class="key key-dir" data-dir="down">8<small>▼</small></button>
    <button class="key">9</button>
    <button class="key">*</button>
    <button class="key">0</button>
    <button class="key">#</button>
  </div>
</div>

<h1>食蛇</h1>
<p class="tagline">數字鍵2/4/6/8控制方向，5暫停 — keys 2/4/6/8 steer, 5 pauses</p>

<button id="music-btn">🎵 音樂 / music</button>
<audio id="bgm" loop preload="none"></audio>

<footer><a href="/">返回首頁 / home</a></footer>

<script>
const COLS = 24, ROWS = 16, CELL = 20, TICK_MS = 150;
const canvas = document.getElementById("board");
const ctx = canvas.getContext("2d");
const scoreEl = document.getElementById("score");
const highScoreEl = document.getElementById("high-score");
const overlay = document.getElementById("overlay");
const overlayText = document.getElementById("overlay-text");
const restartBtn = document.getElementById("restart-btn");
const pauseBtn = document.getElementById("pause-btn");
const pauseIcon = document.getElementById("pause-icon");
const musicBtn = document.getElementById("music-btn");
const bgm = document.getElementById("bgm");
bgm.volume = 0.5;

// No server/directory listing to draw from (static Vercel hosting) -- this
// list is hand-maintained, same convention as this project's other
// hand-maintained lists (e.g. PRICEWATCH_PRODUCTS). Keep in sync with
// gateway/public/music/ if tracks are added or removed.
const TRACKS = [
  "the_mountain-game-game-music-508018.mp3",
  "kulakovka-game-streaming-291439.mp3",
  "mfcc-retro-arcade-game-music-297305.mp3",
  "mondamusic-retro-arcade-game-music-512837.mp3",
  "tatamusic-game-gaming-video-game-music-482380.mp3",
  "viacheslavstarostin-gaming-game-video-game-music-474517.mp3",
];

function pickRandomTrack() {
  bgm.src = "/music/" + TRACKS[Math.floor(Math.random() * TRACKS.length)];
}

// Music preference persists (default on) the same way high score does;
// "on" only means "play when the game is actually running" -- it always
// stops for a game-over and always (re)starts on a fresh game, unless the
// player has explicitly turned it off via the button.
const MUSIC_KEY = "snakeMusicEnabled";
let musicEnabled = localStorage.getItem(MUSIC_KEY) !== "off";

function updateMusicBtn() {
  musicBtn.classList.toggle("playing", musicEnabled);
}
updateMusicBtn();

function playMusicIfEnabled() {
  if (!musicEnabled || over) return;
  // Browsers reject play() without a prior user gesture -- harmless here,
  // the first-gesture listener below retries once that gesture happens.
  bgm.play().catch(() => {});
}

musicBtn.addEventListener("click", () => {
  musicEnabled = !musicEnabled;
  localStorage.setItem(MUSIC_KEY, musicEnabled ? "on" : "off");
  updateMusicBtn();
  if (musicEnabled) playMusicIfEnabled();
  else bgm.pause();
});

["keydown", "click", "touchstart"].forEach((evt) =>
  document.addEventListener(evt, () => playMusicIfEnabled(), { once: true })
);

const HIGH_SCORE_KEY = "snakeHighScore";
let highScore = Number(localStorage.getItem(HIGH_SCORE_KEY)) || 0;
highScoreEl.textContent = String(highScore).padStart(4, "0");

let snake, direction, nextDirection, food, score, paused, over, timer;

function resetGame() {
  snake = [{ x: 10, y: 8 }, { x: 9, y: 8 }, { x: 8, y: 8 }];
  direction = { x: 1, y: 0 };
  nextDirection = direction;
  score = 0;
  paused = false;
  over = false;
  scoreEl.textContent = "0000";
  pauseIcon.textContent = "⏸";
  overlay.classList.remove("show");
  pickRandomTrack();
  playMusicIfEnabled();
  spawnFood();
  draw();
  if (timer) clearInterval(timer);
  timer = setInterval(tick, TICK_MS);
}

function spawnFood() {
  let cell;
  do {
    cell = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) };
  } while (snake.some((s) => s.x === cell.x && s.y === cell.y));
  food = cell;
}

function setDirection(dx, dy) {
  if (over || paused) return;
  // Ignore a reversal into the snake's own neck.
  if (dx === -direction.x && dy === -direction.y) return;
  nextDirection = { x: dx, y: dy };
}

function togglePause() {
  if (over) return;
  paused = !paused;
  pauseIcon.textContent = paused ? "▶" : "⏸";
}

function tick() {
  if (paused || over) return;
  direction = nextDirection;
  const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };

  const hitWall = head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS;
  const hitSelf = snake.some((s) => s.x === head.x && s.y === head.y);
  if (hitWall || hitSelf) {
    endGame();
    return;
  }

  snake.unshift(head);
  if (head.x === food.x && head.y === food.y) {
    score++;
    scoreEl.textContent = String(score).padStart(4, "0");
    if (score > highScore) {
      highScore = score;
      highScoreEl.textContent = String(highScore).padStart(4, "0");
      localStorage.setItem(HIGH_SCORE_KEY, String(highScore));
    }
    spawnFood();
  } else {
    snake.pop();
  }
  draw();
}

function endGame() {
  over = true;
  clearInterval(timer);
  bgm.pause();
  overlayText.textContent = `遊戲結束 分數${score} / GAME OVER ${score}`;
  overlay.classList.add("show");
}

// Classic monochrome LCD palette -- fixed colours, matching the reference
// Nokia 3310 screen exactly rather than following the site's light/dark
// theme (this is meant to look like a physical LCD, not adapt to it).
const LCD_BG = "#9bbc0f";
const LCD_FG = "#0f380f";

function draw() {
  ctx.fillStyle = LCD_BG;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = LCD_FG;
  ctx.beginPath();
  ctx.arc(food.x * CELL + CELL / 2, food.y * CELL + CELL / 2, CELL * 0.28, 0, Math.PI * 2);
  ctx.fill();
  snake.forEach((s) => ctx.fillRect(s.x * CELL + 1, s.y * CELL + 1, CELL - 2, CELL - 2));
}

document.addEventListener("keydown", (e) => {
  const map = { ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0] };
  if (map[e.key]) {
    e.preventDefault();
    setDirection(...map[e.key]);
  } else if (e.key === " ") {
    e.preventDefault();
    togglePause();
  }
});

document.querySelectorAll(".keypad [data-dir]").forEach((btn) => {
  const map = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
  btn.addEventListener("click", () => setDirection(...map[btn.dataset.dir]));
});
pauseBtn.addEventListener("click", togglePause);
restartBtn.addEventListener("click", resetGame);

resetGame();
</script>
</body>
</html>
